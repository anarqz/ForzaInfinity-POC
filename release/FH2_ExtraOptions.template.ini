; Forza Horizon 2 Extra Options
; Release v0.2.74, with ForzaInfinity
; Compatible with Azimuth 0.9.7, 0.9.9 and 0.9.10
; by Arthur (RokkuDayo); ForzaInfinity sections at the end

; INI settings are read at game startup.
; Graphics, camera and HUD options are configured in-game and saved to FH2_ExtraOptions.dat.
; 0 = off, 1 = on.

[Global]
; Toggles the entire feature set of the mod on or off.
Enabled=1

[Content]
; Grants entitlements for all DLC content.
; Treasure Map and VIP DLCs have their own toggles below.
; The Storm Island map will not be accessible if you don't have the DLC package mounted, but it's vehicles will be available regardless.
UnlockDLC=1

; Grants entitlement for VIP status and its perks.
; Double credits and XP rewards, and double bonus on wheelspins.
OfflineVIP=1

; Reveals all bonus boards and barn locations on the mainland and Storm Island.
; Also enables the Treasure Map listing in the Extras menu of the Marketplace tab while offline.
; Important: Enabling this, entering the game, saving, disabling this, and then entering the game again will keep all boards discovered.
UnlockTreasureMap=0

; Bypasses Storm Island event requirements for purchasing the Ranger T6 and #7 SST.
UnlockStormIslandCars=1

[Frontend]
; Boots straight into the "Press Start" menu.
SkipIntro=1

; Enables the "Get In Car" feature during free-roam in the "My Cars" section of the pause menu.
; WARNING: unstable. With it on, fast travel can crash the game (it also changes the fast
; travel flow and removes its world-streaming waits). Off by default in ForzaInfinity.
GetInCarFromPauseMenu=0

; Adds combined aftermarket and stock rim library categories without changing the game database.
AllRimsCategory=1

; Enables tabs in the pause menu that require an XBOX Live connection.
EnableMarketplace=1
EnableSocial=1
EnableClubs=1
EnableRivals=1

[Livery]
; Changes the rendering resolution for the player's livery from 1024x1024 to 4096x4096.
Enable4K=1

; Sets the multisampling mode for the player's livery.
; 2 = Vanilla intermediate 2x MSAA; 4 = Enhanced intermediate 4x MSAA.
IntermediateMSAA=4

; Enables 2x supersampling per livery region to the intermediate render.
; Final liveries remain rendered at 4096x4096. 
; This adds a slight extra cost to memory usage for little improvement to the aliasing on the texture.
ExtraSupersampling=0

[PhotoMode]
; Removes the camera collision detection and boundaries in photo mode.
FreeCamera=1

[Autodrive]
; Allows you to set a GPS route in free roam and then press F2 or D-pad Down to have the game drive you there.
; Pressing F2/D-pad Down again, steering, accelerating, braking, pausing or arriving restores player control.
Enabled=1

; Enables a cinematic camera during Autodrive by using the cameras from replay mode.
; Kicks in after 3 seconds.
Cinematic=1

; ForzaInfinity: Autodrive also works during events (the AI drives the event for you, also
; online, where its results count as yours). Off by default.
InEvents=0

[Profile]
; Uses the Gamerpic.png beside this INI file as the player's avatar.
; Maximum supported dimensions are 2048x2048 and a maximum file size of 16 MB. Square PNG recommended.
CustomGamerpic=1

[Compatibility]
; Allow user-created content privilege checks locally.
; This has no effect on Mezcal.
DisableParentalLocks=1

; Skips Azimuth's save data blob hash and file size comparisons, and rebuilds missing commit markers at startup.
; You still need to follow Azimuth's custom directory structure, but this should make it easier to add new liveries and vinyls to your save.
; This has no effect on Mezcal.
; ForzaInfinity: left off, so Azimuth keeps checking the saves the cloud save installs.
DisableAzimuthSaveChecksums=0

[Files]
; Loose assets beside the game EXE.
; The priority goes: mediaoverride > mediapc > original media.
; Example: media/Camera.zip/CameraGroups.xml becomes mediaoverride/Camera/CameraGroups.xml.
; Restart the game after changing files.
EnableMediaOverrides=0

[Network]
; ForzaInfinity: the game's online requests (IXMLHTTPRequest2) inside Azimuth.
; Off     = Azimuth's own behaviour (offline).
; Capture = logs each request to FH2_Network.jsonl and answers "offline", as Azimuth does.
; Proxy   = sends them to the ForzaInfinity server and gives its answers to the game.
Mode=Proxy

; The ForzaInfinity server: https://host or host:port.
Server=__SERVER__

[FreeRoam]
; ForzaInfinity: online free roam, in worlds the players host (Settings > INFINITY > HOST WORLD).
; 1 = on, 0 = off.
Enabled=1
; 1 sends the game straight to a world, without the proxy that gets it through routers.
; For troubleshooting only (docs/FREEROAM.md).
Direct=0
