; Configuração do dedicated_server (o mundo de free roam que você hospeda).
; Fica ao lado do dedicated_server.exe. Toda chave é opcional: sem ela, vale o padrão
; mostrado aqui. Comentários começam com ";" (no meio da linha, precisa de um espaço antes).

[World]
; Nome do mundo na lista (ainda não usado: a lista de mundos chega numa próxima versão).
Name=
; Mensagem para quem entra (ainda não usada).
Message=
; Quem vê o mundo na lista: public (todos), unlisted (só com o link), friends (só amigos)
; ou off (ninguém). Ainda não usado.
Visibility=public
; Senha para entrar (vazio = sem senha). Nunca aparece no console nem no log. Ainda não usada.
Password=
; Máximo de jogadores ao mesmo tempo, de 1 a 12 (12 é o limite do jogo).
; Quem chega com o mundo cheio é recusado.
MaxPlayers=8

[Network]
; Porta UDP do mundo. Libere essa porta no firewall e, se for jogar pela internet,
; encaminhe-a no roteador para este PC. O --port na linha de comando vence esta.
Port=5101
; Abrir a porta no roteador sozinho, por UPnP (1 = sim, 0 = não). Ainda não implementado.
UPnP=1
; Onde o mundo é anunciado. Ainda não usado.
Announce=https://infinity.anarqz.dev

[Access]
; Gamertags que podem entrar, separadas por vírgula (vazio = todos). Ainda não aplicado.
Allow=
; Gamertags que não podem entrar, separadas por vírgula. Ainda não aplicado.
Ban=

[Log]
; Cada mensagem do protocolo no log (1 = sim), como o --verbose. Só para testes: o log cresce rápido.
Verbose=0

[Events]
; Corridas e eventos do mundo (1 = o relay conduz as corridas; 0 = quem entra num evento volta ao free roam).
Races=1
